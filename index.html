<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be Hinatsu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --panel: #121215;
      --border: #26262c;
      --text: #ffffff;
      --muted: #8e8e98;
      --font-en: "Inter", "Noto Sans JP", sans-serif;
      --font-jp: "Noto Sans JP", "Inter", sans-serif;
      --card-w: 240px;
    }

    @media (min-width: 1100px) {
      :root {
        --card-w: 340px;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-jp);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .layout {
      display: grid;
      grid-template-columns: calc(var(--card-w) + 64px) 1fr;
      width: 100%;
      min-height: 100vh;
      padding: 24px 28px;
      gap: 32px;
    }

    .left-pane {
      position: sticky;
      top: 24px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand {
      align-self: flex-start;
      font-family: var(--font-en);
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .featured-date {
      font-family: var(--font-en);
      font-weight: 900;
      font-size: clamp(2.1rem, 2.8vw, 2.75rem);
      letter-spacing: 0.01em;
      margin-bottom: 14px;
      text-align: center;
    }
    .featured-card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: 9 / 17.5;
      border-radius: 18px;
      overflow: hidden;
      background: #0d0d10;
      border: 1px solid #1f1f24;
      user-select: none;
      transition: width 0.25s ease;
    }
    .featured-card .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1;
      transition: opacity 0.28s ease;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .featured-card .main-img.fading {
      opacity: 0.15;
    }

    .featured-card .sub-pip {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34%;
      aspect-ratio: 9 / 17;
      border-radius: 11px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.82);
      cursor: grab;
      touch-action: none;
      z-index: 5;
      transition: box-shadow 0.18s ease, transform 0.18s ease;
    }
    .featured-card .sub-pip.dragging {
      cursor: grabbing;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.95);
      border-color: rgba(255, 255, 255, 0.65);
    }
    .featured-card .sub-pip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1;
      transition: opacity 0.28s ease;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .featured-card .sub-pip img.fading {
      opacity: 0.15;
    }

    .featured-empty {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--font-en);
      font-weight: 900;
      font-size: 0.85rem;
    }
    .featured-memo {
      margin-top: 12px;
      font-family: var(--font-jp);
      font-size: 0.88rem;
      font-weight: 700;
      color: #e4e4e8;
      text-align: center;
      max-width: var(--card-w);
      line-height: 1.45;
      min-height: 1.4em;
      transition: opacity 0.25s ease;
    }
    .featured-memo.fading {
      opacity: 0.2;
    }

    .right-pane {
      position: relative;
      width: 100%;
      padding-bottom: 64px;
      padding-right: 148px;
    }
    .top-actions {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 10px;
      z-index: 50;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #232327;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.15s ease;
    }
    .icon-btn:hover {
      background: #323238;
      transform: scale(1.05);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    /* ベル許可状態（白背景＋黒ベル） */
    .icon-btn.bell-enabled {
      background: #d4d4d8;
      color: #09090b;
      border-color: #ffffff;
    }
    .icon-btn.bell-enabled:hover {
      background: #e4e4e7;
    }

    .year-block {
      margin-bottom: 44px;
    }
    .year-title {
      font-family: var(--font-en);
      font-weight: 900;
      font-size: 2.1rem;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .month-block {
      margin-bottom: 40px;
    }
    .month-title {
      font-family: var(--font-jp);
      font-weight: 900;
      font-size: 1.65rem;
      margin-bottom: 18px;
    }
    .month-num {
      font-family: var(--font-en);
      font-weight: 900;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      column-gap: 16px;
      row-gap: 18px;
      width: 100%;
    }
    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    /* 未撮影日：リキッドグラス効果 */
    .day-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 17.5;
      border-radius: 9px;
      background:
        radial-gradient(120% 90% at 20% 10%, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0.05) 100%),
        rgba(24, 24, 30, 0.42);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.24),
        inset 0 -1px 1px rgba(255, 255, 255, 0.05),
        0 6px 18px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .day-thumb:not(.has-post):hover {
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        0 8px 22px rgba(255, 255, 255, 0.06);
    }

    .day-thumb.has-post {
      background: #09090c;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      cursor: pointer;
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }
    .day-thumb.has-post:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.14);
    }
    .day-thumb.active {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }
    .day-thumb .t-main {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .day-thumb .t-sub {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 34%;
      aspect-ratio: 9 / 17;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.85);
    }
    .day-thumb .t-sub img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .day-num {
      font-family: var(--font-en);
      font-weight: 900;
      font-size: 0.85rem;
      color: #e4e4e8;
    }

    /* モーダル（通知確認・ログイン・投稿） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      background: #141418;
      border: 1px solid #2b2b34;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      font-family: var(--font-jp);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-header h2 {
      font-family: var(--font-jp);
      font-size: 1.1rem;
      font-weight: 900;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-family: var(--font-jp);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input[type="text"],
    .field input[type="password"],
    .field input[type="date"] {
      width: 100%;
      background: #09090b;
      border: 1px solid #2a2a33;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: var(--font-jp);
      font-size: 0.9rem;
    }
    .file-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .file-box {
      background: #09090b;
      border: 1px dashed #32323d;
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      font-family: var(--font-jp);
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
    }
    .file-box.ready {
      border-color: #4ade80;
      color: #4ade80;
    }
    .file-box input { display: none; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-primary {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-family: var(--font-jp);
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-secondary {
      width: 100%;
      background: #23232a;
      color: #ffffff;
      border: 1px solid #353540;
      padding: 11px;
      border-radius: 10px;
      font-family: var(--font-jp);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-sub {
      background: #222229;
      color: #ffffff;
      border: 1px solid #32323d;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: var(--font-jp);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .notif-lead {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.6;
      color: #f4f4f6;
    }
    .notif-highlight {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 900;
      text-align: center;
      display: none;
    }
    .notif-highlight.show {
      display: block;
    }
    .status-msg {
      margin-top: 10px;
      font-family: var(--font-jp);
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      :root {
        --card-w: 240px;
      }
      .layout {
        grid-template-columns: 1fr;
        padding: 16px 12px;
        gap: 28px;
      }
      .left-pane {
        position: static;
      }
      .right-pane {
        padding-right: 0;
      }
      .days-grid {
        grid-template-columns: repeat(7, 1fr);
        column-gap: 6px;
        row-gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 右上アクションボタン（ベル・投稿・鍵） -->
  <div class="top-actions">
    <button class="icon-btn" id="bellTriggerBtn" title="通知設定" onclick="openBellModal()">
      <!-- JSで許可状態に応じてベルSVGを切り替えます -->
    </button>
    <button class="icon-btn" id="postTriggerBtn" style="display:none;" title="写真をアップロード" onclick="openModal('postModal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button class="icon-btn" id="keyTriggerBtn" title="ログイン / GitHub設定" onclick="openModal('loginModal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15.5" cy="8.5" r="4.5"></circle>
        <path d="M12.3 11.7L4 20"></path>
        <path d="M6 18l2 2"></path>
        <path d="M8.5 15.5l2 2"></path>
      </svg>
    </button>
  </div>

  <div class="layout">
    <aside class="left-pane">
      <div class="brand">Be Hinatsu</div>
      <div class="featured-date" id="featDate">--/--</div>
      <div class="featured-card" id="featCard">
        <div class="featured-empty">No Photo</div>
      </div>
      <div class="featured-memo" id="featMemo"></div>
    </aside>

    <main class="right-pane" id="archiveContainer"></main>
  </div>

  <!-- 通知許可確認モーダル -->
  <div class="modal-backdrop" id="bellModal">
    <div class="modal">
      <div class="modal-header">
        <h2>通知を許可しますか？</h2>
        <button class="close-btn" onclick="closeModal('bellModal')">&times;</button>
      </div>
      <p class="notif-lead" id="bellLeadText">
        新しい写真が投稿されたときに通知を受け取るには、ブラウザの通知権限を許可してください。
      </p>
      <div class="notif-highlight" id="bellReadyBanner">更新が来しだい通知します！！</div>
      <div class="modal-actions" id="bellActionButtons">
        <button type="button" class="btn-secondary" onclick="closeModal('bellModal')">受け取らない</button>
        <button type="button" class="btn-primary" id="allowNotifBtn" onclick="requestNotificationPermission()">許可する</button>
      </div>
      <p class="status-msg" id="bellStatus"></p>
    </div>
  </div>

  <!-- ログイン（GitHub接続設定）モーダル -->
  <div class="modal-backdrop" id="loginModal">
    <div class="modal">
      <div class="modal-header">
        <h2>ログイン（GitHub連携）</h2>
        <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
      </div>
      <div class="field">
        <label>GitHub ユーザー名</label>
        <input type="text" id="cfgOwner" placeholder="例: hinatsu-vrc" />
      </div>
      <div class="field">
        <label>リポジトリ名</label>
        <input type="text" id="cfgRepo" placeholder="例: be-hinatsu" />
      </div>
      <div class="field">
        <label>Personal Access Token</label>
        <input type="password" id="cfgToken" placeholder="github_pat_..." />
      </div>
      <button class="btn-primary" onclick="saveLogin()">ログイン情報を保存</button>
      <p class="status-msg" id="loginStatus"></p>
    </div>
  </div>

  <!-- 投稿モーダル -->
  <div class="modal-backdrop" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h2>写真をアップロード</h2>
        <button class="close-btn" onclick="closeModal('postModal')">&times;</button>
      </div>
      <div class="field">
        <label>日付（PNGのファイル名から自動入力されます）</label>
        <input type="date" id="postDate" />
      </div>
      <div class="file-row">
        <label class="file-box" id="frontLabel">
          <strong>表（メイン）</strong><br /><span id="frontName">PNGを選択</span>
          <input type="file" id="frontInput" accept="image/*" onchange="handleFileSelect('front')" />
        </label>
        <label class="file-box" id="backLabel">
          <strong>裏（右上小窓）</strong><br /><span id="backName">PNGを選択</span>
          <input type="file" id="backInput" accept="image/*" onchange="handleFileSelect('back')" />
        </label>
      </div>
      <div style="text-align:right; margin-bottom:12px;">
        <button type="button" class="btn-sub" onclick="swapUploadSides()">⇄ 表と裏を入れ替え</button>
      </div>
      <div class="field">
        <label>今日の一言</label>
        <input type="text" id="postMemo" placeholder="例: （今日の一言）" />
      </div>
      <button class="btn-primary" id="uploadBtn" onclick="uploadPost()">アップロード</button>
      <p class="status-msg" id="uploadStatus"></p>
    </div>
  </div>

  <script>
    let allPosts = [];
    let selectedDateStr = null;
    let frontDataUrl = null;
    let backDataUrl = null;

    let customPipPos = null;
    let isSwappedView = false;

    // 通知トグル状態（ブラウザ権限がgrantedかつユーザーが有効にしているか）
    let notifyEnabled = false;

    window.addEventListener("DOMContentLoaded", () => {
      const owner = localStorage.getItem("gh_owner") || "";
      const repo = localStorage.getItem("gh_repo") || "";
      const token = localStorage.getItem("gh_token") || "";

      document.getElementById("cfgOwner").value = owner;
      document.getElementById("cfgRepo").value = repo;
      document.getElementById("cfgToken").value = token;

      const today = new Date();
      document.getElementById("postDate").value = formatDateISO(today);

      syncNotificationState();
      updateAuthUI();
      loadPosts();

      // 定期的に新着投稿を確認
      setInterval(() => {
        checkNewPostsForNotification();
      }, 60000);
    });

    function syncNotificationState() {
      const savedPref = localStorage.getItem("be_hinatsu_notify_enabled") === "true";
      if ("Notification" in window && Notification.permission === "granted" && savedPref) {
        notifyEnabled = true;
      } else {
        notifyEnabled = false;
      }
      renderBellButton();
    }

    function renderBellButton() {
      const btn = document.getElementById("bellTriggerBtn");
      btn.classList.toggle("bell-enabled", notifyEnabled);

      if (notifyEnabled) {
        // 通知許可状態：白背景・黒ベル・左右に音波（鳴動線）
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.2 6.5A8.5 8.5 0 0 0 3.5 12"></path>
            <path d="M18.8 6.5A8.5 8.5 0 0 1 20.5 12"></path>
            <path d="M7.5 16V11a4.5 4.5 0 0 1 9 0v5l1.5 2H6l1.5-2Z"></path>
            <path d="M10 18a2 2 0 0 0 4 0"></path>
          </svg>
        `;
      } else {
        // 未許可・オフ状態：ダーク背景・静かなベル
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 16V11a4.5 4.5 0 0 1 9 0v5l1.5 2H6l1.5-2Z"></path>
            <path d="M10 18a2 2 0 0 0 4 0"></path>
          </svg>
        `;
      }
    }

    function openBellModal() {
      const banner = document.getElementById("bellReadyBanner");
      const status = document.getElementById("bellStatus");
      const lead = document.getElementById("bellLeadText");
      const actions = document.getElementById("bellActionButtons");

      status.textContent = "";

      if (!("Notification" in window)) {
        banner.classList.remove("show");
        actions.style.display = "none";
        lead.textContent = "お使いのブラウザは通知機能に対応していません。";
        openModal("bellModal");
        return;
      }

      if (notifyEnabled && Notification.permission === "granted") {
        lead.textContent = "現在、通知は許可されています。";
        banner.textContent = "更新が来しだい通知します！！";
        banner.classList.add("show");
        actions.innerHTML = `
          <button type="button" class="btn-secondary" onclick="disableNotification()">通知をオフにする</button>
          <button type="button" class="btn-primary" onclick="closeModal('bellModal')">閉じる</button>
        `;
        actions.style.display = "flex";
      } else {
        lead.textContent = "通知を許可しますか？権限を許可すると、新しい写真が追加されたときに通知をお知らせします。";
        banner.classList.remove("show");
        actions.innerHTML = `
          <button type="button" class="btn-secondary" onclick="closeModal('bellModal')">受け取らない</button>
          <button type="button" class="btn-primary" id="allowNotifBtn" onclick="requestNotificationPermission()">許可する</button>
        `;
        actions.style.display = "flex";
      }

      openModal("bellModal");
    }

    async function requestNotificationPermission() {
      const status = document.getElementById("bellStatus");
      const banner = document.getElementById("bellReadyBanner");

      if (!("Notification" in window)) {
        status.textContent = "このブラウザでは通知が利用できません。";
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          notifyEnabled = true;
          localStorage.setItem("be_hinatsu_notify_enabled", "true");
          renderBellButton();

          banner.textContent = "更新が来しだい通知します！！";
          banner.classList.add("show");
          status.textContent = "通知が有効になりました。";

          if (allPosts.length > 0) {
            localStorage.setItem("be_hinatsu_last_seen_date", allPosts[0].date);
          }

          new Notification("Be Hinatsu", {
            body: "更新が来しだい通知します！！"
          });
        } else if (permission === "denied") {
          notifyEnabled = false;
          localStorage.setItem("be_hinatsu_notify_enabled", "false");
          renderBellButton();
          banner.classList.remove("show");
          status.textContent = "ブラウザの設定から通知がブロックされています。アドレスバーのアイコンから通知を許可してください。";
        } else {
          notifyEnabled = false;
          renderBellButton();
          banner.classList.remove("show");
          status.textContent = "通知は許可されませんでした。";
        }
      } catch (err) {
        status.textContent = `通知設定エラー: ${err.message}`;
      }
    }

    function disableNotification() {
      notifyEnabled = false;
      localStorage.setItem("be_hinatsu_notify_enabled", "false");
      renderBellButton();
      document.getElementById("bellReadyBanner").classList.remove("show");
      document.getElementById("bellLeadText").textContent = "通知を受け取らない設定にしました。";
      document.getElementById("bellActionButtons").innerHTML = `
        <button type="button" class="btn-primary" onclick="closeModal('bellModal')">閉じる</button>
      `;
    }

    async function checkNewPostsForNotification() {
      if (!notifyEnabled || Notification.permission !== "granted") return;
      try {
        const res = await fetch(`posts.json?t=${Date.now()}`);
        if (!res.ok) return;
        const latestPosts = await res.json();
        if (!Array.isArray(latestPosts) || latestPosts.length === 0) return;
        latestPosts.sort((a, b) => b.date.localeCompare(a.date));

        const newestDate = latestPosts[0].date;
        const lastSeen = localStorage.getItem("be_hinatsu_last_seen_date");

        if (lastSeen && newestDate > lastSeen) {
          new Notification("Be Hinatsu", {
            body: `${newestDate} の新しい写真が更新されました！`
          });
        }
        localStorage.setItem("be_hinatsu_last_seen_date", newestDate);
      } catch (_) {}
    }

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function updateAuthUI() {
      const loggedIn = Boolean(
        localStorage.getItem("gh_owner") &&
        localStorage.getItem("gh_repo") &&
        localStorage.getItem("gh_token")
      );
      document.getElementById("postTriggerBtn").style.display = loggedIn ? "flex" : "none";
    }

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function saveLogin() {
      localStorage.setItem("gh_owner", document.getElementById("cfgOwner").value.trim());
      localStorage.setItem("gh_repo", document.getElementById("cfgRepo").value.trim());
      localStorage.setItem("gh_token", document.getElementById("cfgToken").value.trim());
      document.getElementById("loginStatus").textContent = "ログイン情報を保存しました。";
      updateAuthUI();
      setTimeout(() => {
        closeModal("loginModal");
        openModal("postModal");
      }, 600);
    }

    function compressImage(file, maxWidth = 1080, quality = 0.85) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function extractDateFromFilename(name) {
      const m = name.match(/(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : null;
    }

    async function handleFileSelect(side) {
      const input = document.getElementById(side === "front" ? "frontInput" : "backInput");
      const file = input.files[0];
      if (!file) return;

      const parsed = extractDateFromFilename(file.name);
      if (parsed) {
        document.getElementById("postDate").value = parsed;
      }

      const dataUrl = await compressImage(file);
      if (side === "front") {
        frontDataUrl = dataUrl;
        document.getElementById("frontName").textContent = "選択完了 ✓";
        document.getElementById("frontLabel").classList.add("ready");
      } else {
        backDataUrl = dataUrl;
        document.getElementById("backName").textContent = "選択完了 ✓";
        document.getElementById("backLabel").classList.add("ready");
      }
    }

    function swapUploadSides() {
      if (!frontDataUrl && !backDataUrl) return;
      [frontDataUrl, backDataUrl] = [backDataUrl, frontDataUrl];
      document.getElementById("frontName").textContent = frontDataUrl ? "選択完了 ✓" : "PNGを選択";
      document.getElementById("backName").textContent = backDataUrl ? "選択完了 ✓" : "PNGを選択";
      document.getElementById("frontLabel").classList.toggle("ready", Boolean(frontDataUrl));
      document.getElementById("backLabel").classList.toggle("ready", Boolean(backDataUrl));
    }

    async function githubRequest(path, method = "GET", body = null) {
      const owner = localStorage.getItem("gh_owner");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const res = await fetch(url, {
        method,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: body ? JSON.stringify(body) : null
      });
      if (!res.ok && res.status !== 404) {
        throw new Error(`GitHub API Error (${res.status})`);
      }
      return res.status === 404 ? null : await res.json();
    }

    async function uploadPost() {
      const statusEl = document.getElementById("uploadStatus");
      const dateVal = document.getElementById("postDate").value;
      const memoVal = document.getElementById("postMemo").value.trim();

      if (!dateVal) {
        statusEl.textContent = "日付を選択してください。";
        return;
      }
      if (!frontDataUrl || !backDataUrl) {
        statusEl.textContent = "表と裏の2枚の画像を選択してください。";
        return;
      }

      const btn = document.getElementById("uploadBtn");
      btn.disabled = true;

      try {
        const stamp = Date.now();
        const frontPath = `photos/${dateVal}_${stamp}_front.webp`;
        const backPath = `photos/${dateVal}_${stamp}_back.webp`;

        statusEl.textContent = "1/3 表の画像をアップロード中...";
        await githubRequest(frontPath, "PUT", {
          message: `Upload front ${dateVal}`,
          content: frontDataUrl.split(",")[1]
        });

        statusEl.textContent = "2/3 裏の画像をアップロード中...";
        await githubRequest(backPath, "PUT", {
          message: `Upload back ${dateVal}`,
          content: backDataUrl.split(",")[1]
        });

        statusEl.textContent = "3/3 カレンダーデータを更新中...";
        const existing = await githubRequest("posts.json");
        let posts = [];
        let sha = null;

        if (existing && existing.content) {
          sha = existing.sha;
          const decoded = decodeURIComponent(escape(atob(existing.content.replace(/\n/g, ""))));
          posts = JSON.parse(decoded);
        }

        posts = posts.filter((p) => p.date !== dateVal);
        posts.push({
          date: dateVal,
          front: frontPath,
          back: backPath,
          memo: memoVal
        });

        posts.sort((a, b) => b.date.localeCompare(a.date));

        const jsonStr = JSON.stringify(posts, null, 2);
        const encodedJson = btoa(unescape(encodeURIComponent(jsonStr)));

        await githubRequest("posts.json", "PUT", {
          message: `Update posts.json (${dateVal})`,
          content: encodedJson,
          ...(sha ? { sha } : {})
        });

        allPosts = posts;
        selectedDateStr = dateVal;
        isSwappedView = false;
        localStorage.setItem("be_hinatsu_last_seen_date", allPosts[0].date);
        renderAll(true);

        statusEl.textContent = "完了しました！（サイト反映には数十秒かかる場合があります）";
        setTimeout(() => {
          closeModal("postModal");
          statusEl.textContent = "";
        }, 1200);
      } catch (err) {
        statusEl.textContent = `エラー: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadPosts() {
      try {
        const res = await fetch(`posts.json?t=${Date.now()}`);
        if (res.ok) {
          allPosts = await res.json();
          allPosts.sort((a, b) => b.date.localeCompare(a.date));
        }
      } catch (e) {
        allPosts = [];
      }
      if (allPosts.length > 0) {
        if (!selectedDateStr) {
          selectedDateStr = allPosts[0].date;
        }
        if (!localStorage.getItem("be_hinatsu_last_seen_date")) {
          localStorage.setItem("be_hinatsu_last_seen_date", allPosts[0].date);
        }
      }
      renderAll(false);
    }

    function renderAll(withFade = true) {
      renderLeftFeatured(withFade);
      renderRightCalendar();
    }

    function renderLeftFeatured(withFade = true) {
      const dateEl = document.getElementById("featDate");
      const cardEl = document.getElementById("featCard");
      const memoEl = document.getElementById("featMemo");

      const post = allPosts.find((p) => p.date === selectedDateStr) || allPosts[0];
      if (!post) {
        const now = new Date();
        dateEl.textContent = `${now.getMonth() + 1}/${now.getDate()}`;
        cardEl.innerHTML = `<div class="featured-empty">No Photo</div>`;
        memoEl.textContent = "（今日の一言）";
        return;
      }

      const mainSrc = isSwappedView ? post.back : post.front;
      const subSrc = isSwappedView ? post.front : post.back;

      const applyContent = () => {
        const [, m, d] = post.date.split("-");
        dateEl.textContent = `${Number(m)}/${Number(d)}`;
        memoEl.textContent = post.memo || "";

        cardEl.innerHTML = `
          <img class="main-img" src="${mainSrc}" alt="main" />
          <div class="sub-pip" title="ドラッグで移動・クリックで表裏入れ替え">
            <img src="${subSrc}" alt="sub" />
          </div>
        `;

        const subPip = cardEl.querySelector(".sub-pip");
        if (customPipPos) {
          subPip.style.left = `${customPipPos.left}px`;
          subPip.style.top = `${customPipPos.top}px`;
          subPip.style.right = "auto";
        }

        setupPipDragAndSwap(cardEl, subPip);
      };

      if (withFade) {
        const prevMain = cardEl.querySelector(".main-img");
        const prevSub = cardEl.querySelector(".sub-pip img");
        if (prevMain) prevMain.classList.add("fading");
        if (prevSub) prevSub.classList.add("fading");
        memoEl.classList.add("fading");

        setTimeout(() => {
          applyContent();
          const nextMain = cardEl.querySelector(".main-img");
          const nextSub = cardEl.querySelector(".sub-pip img");
          requestAnimationFrame(() => {
            if (nextMain) nextMain.classList.remove("fading");
            if (nextSub) nextSub.classList.remove("fading");
            memoEl.classList.remove("fading");
          });
        }, 140);
      } else {
        applyContent();
      }
    }

    function setupPipDragAndSwap(cardEl, subPip) {
      let dragging = false;
      let movedDistance = 0;
      let startX = 0;
      let startY = 0;
      let originLeft = 0;
      let originTop = 0;

      const onPointerDown = (e) => {
        e.preventDefault();
        const cardRect = cardEl.getBoundingClientRect();
        const pipRect = subPip.getBoundingClientRect();

        startX = e.clientX;
        startY = e.clientY;
        originLeft = pipRect.left - cardRect.left;
        originTop = pipRect.top - cardRect.top;
        movedDistance = 0;
        dragging = true;

        subPip.style.left = `${originLeft}px`;
        subPip.style.top = `${originTop}px`;
        subPip.style.right = "auto";
        subPip.classList.add("dragging");
        subPip.setPointerCapture(e.pointerId);
      };

      const onPointerMove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        movedDistance = Math.hypot(dx, dy);

        const cardRect = cardEl.getBoundingClientRect();
        const pipRect = subPip.getBoundingClientRect();
        const pad = 8;

        const maxLeft = Math.max(pad, cardRect.width - pipRect.width - pad);
        const maxTop = Math.max(pad, cardRect.height - pipRect.height - pad);

        const nextLeft = Math.min(maxLeft, Math.max(pad, originLeft + dx));
        const nextTop = Math.min(maxTop, Math.max(pad, originTop + dy));

        subPip.style.left = `${nextLeft}px`;
        subPip.style.top = `${nextTop}px`;
        customPipPos = { left: nextLeft, top: nextTop };
      };

      const onPointerUp = (e) => {
        if (!dragging) return;
        dragging = false;
        subPip.classList.remove("dragging");
        if (subPip.hasPointerCapture(e.pointerId)) {
          subPip.releasePointerCapture(e.pointerId);
        }

        if (movedDistance < 6) {
          isSwappedView = !isSwappedView;
          renderLeftFeatured(true);
        }
      };

      subPip.addEventListener("pointerdown", onPointerDown);
      subPip.addEventListener("pointermove", onPointerMove);
      subPip.addEventListener("pointerup", onPointerUp);
      subPip.addEventListener("pointercancel", onPointerUp);
    }

    function renderRightCalendar() {
      const container = document.getElementById("archiveContainer");
      container.innerHTML = "";

      const postMap = new Map(allPosts.map((p) => [p.date, p]));

      const ymSet = new Set();
      const now = new Date();
      ymSet.add(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`);
      allPosts.forEach((p) => {
        ymSet.add(p.date.slice(0, 7));
      });

      const sortedYMs = Array.from(ymSet).sort((a, b) => b.localeCompare(a));

      const yearGroups = new Map();
      sortedYMs.forEach((ym) => {
        const [year, month] = ym.split("-");
        if (!yearGroups.has(year)) yearGroups.set(year, []);
        yearGroups.get(year).push(Number(month));
      });

      yearGroups.forEach((months, year) => {
        const yearSection = document.createElement("section");
        yearSection.className = "year-block";

        const yearH = document.createElement("h2");
        yearH.className = "year-title";
        yearH.textContent = year;
        yearSection.appendChild(yearH);

        months.forEach((monthNum) => {
          const monthSection = document.createElement("div");
          monthSection.className = "month-block";

          const monthH = document.createElement("h3");
          monthH.className = "month-title";
          monthH.innerHTML = `<span class="month-num">${monthNum}</span>月`;
          monthSection.appendChild(monthH);

          const grid = document.createElement("div");
          grid.className = "days-grid";

          const daysInMonth = new Date(Number(year), monthNum, 0).getDate();

          for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = `${year}-${String(monthNum).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const post = postMap.get(dateKey);

            const cell = document.createElement("div");
            cell.className = "day-cell";

            const thumb = document.createElement("div");
            thumb.className = "day-thumb" + (post ? " has-post" : "") + (dateKey === selectedDateStr ? " active" : "");

            if (post) {
              thumb.innerHTML = `
                <img class="t-main" src="${post.front}" alt="${dateKey}" loading="lazy" />
                <div class="t-sub"><img src="${post.back}" alt="" loading="lazy" /></div>
              `;
              thumb.addEventListener("click", () => {
                selectedDateStr = dateKey;
                isSwappedView = false;
                renderAll(true);
                if (window.innerWidth <= 860) {
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }
              });
            }

            const num = document.createElement("div");
            num.className = "day-num";
            num.textContent = day;

            cell.appendChild(thumb);
            cell.appendChild(num);
            grid.appendChild(cell);
          }

          monthSection.appendChild(grid);
          yearSection.appendChild(monthSection);
        });

        container.appendChild(yearSection);
      });
    }
  </script>
